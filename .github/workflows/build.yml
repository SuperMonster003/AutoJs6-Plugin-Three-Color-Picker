name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up icon tooling
        run: python3 -m pip install -r .python/requirements.txt

      - name: Check generated icons
        run: |
          python3 .python/generate_launcher_icons.py --check
          python3 -m unittest discover -s .python/tests

      - name: Check generated documentation
        run: python3 .python/generate_markdown.py --check

      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
          :app:assembleRelease
          --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: three-color-picker-debug-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download debug APKs
        uses: actions/download-artifact@v8
        with:
          name: three-color-picker-debug-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r debug/app-debug.apk
            adb install -r androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w io.github.supermonster003.autojs6.plugin.three.color.picker.test/androidx.test.runner.AndroidJUnitRunner
