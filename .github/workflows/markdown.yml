name: Markdown generation

on:
  push:
    paths:
      - ".readme/**"
      - ".changelog/**"
      - ".python/**"
      - "app/src/main/res/values*/strings.xml"
      - "version.properties"
      - ".github/workflows/markdown.yml"
  pull_request:
    paths:
      - ".readme/**"
      - ".changelog/**"
      - ".python/**"
      - "app/src/main/res/values*/strings.xml"
      - "version.properties"
      - ".github/workflows/markdown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify generated files
        shell: cmd
        run: .python\check_markdown.bat
